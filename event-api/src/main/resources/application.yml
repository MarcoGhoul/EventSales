server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: eventsales
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_sales}
    username: ${DB_USERNAME:eventsales}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:data.sql,classpath:db/functions.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  storage:
    directory: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
